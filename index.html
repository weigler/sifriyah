<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Sifriyah</title>
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#4E1C28">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Source+Serif+4:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #F5EFE0;
    --card: #FBF7EC;
    --ink: #2B2118;
    --ink-soft: #5B4E3F;
    --burgundy: #6B2737;
    --burgundy-dark: #4E1C28;
    --gold: #B8933E;
    --rule: #D8CBB0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    min-height: 100vh;
  }
  body {
    background: var(--burgundy-dark);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(184,147,62,0.10), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(184,147,62,0.08), transparent 45%);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 40px 32px 32px;
    max-width: 380px;
    width: 100%;
    box-shadow: 0 24px 60px rgba(0,0,0,0.38);
    text-align: center;
  }
  .marca {
    font-size: 34px;
    letter-spacing: 2px;
    margin-bottom: 2px;
  }
  h1 {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-weight: 700;
    font-size: 32px;
    margin: 6px 0 2px;
    color: var(--ink);
  }
  .subtitulo {
    font-size: 13px;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
    margin-bottom: 6px;
  }
  .regra {
    border: none;
    border-top: 1.5px solid var(--rule);
    width: 64px;
    margin: 18px auto 22px;
  }
  .tagline {
    font-size: 13.5px;
    color: var(--ink-soft);
    margin-bottom: 26px;
    line-height: 1.5;
  }
  .botoes {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.botao {
    display: flex;
    align-items: center;
    gap: 12px;
    text-align: left;
    text-decoration: none;
    border-radius: 10px;
    padding: 14px 16px;
    border: 1.5px solid var(--rule);
    transition: transform 0.12s ease, box-shadow 0.12s ease, border-color 0.12s ease;
  }
  a.botao:hover, a.botao:focus-visible {
    transform: translateY(-1px);
    box-shadow: 0 8px 20px rgba(43,33,24,0.14);
  }
  a.botao:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .botao .icone {
    font-size: 22px;
    flex: 0 0 auto;
  }
  .botao .texto b {
    display: block;
    font-family: 'Source Serif 4', serif;
    font-size: 16px;
    color: var(--ink);
  }
  .botao .texto span {
    display: block;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 1px;
  }
  .botao.catalogo { background: var(--cream); border-color: var(--rule); }
  .botao.catalogo:hover { border-color: var(--gold); }
  .botao.admin { background: var(--burgundy); border-color: var(--burgundy); }
  .botao.admin .texto b, .botao.admin .icone { color: var(--cream); }
  .botao.admin .texto span { color: rgba(245,239,224,0.75); }
  .botao.admin:hover { border-color: var(--gold); }
  footer {
    margin-top: 26px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    opacity: 0.75;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="marca">📖</div>
    <h1>Sifriyah</h1>
    <div class="subtitulo">ספרייה · Grupo Caseiro</div>
    <hr class="regra">
    <div class="tagline">Escolha por onde entrar: consultar o acervo disponível, ou administrar empréstimos e cadastros.</div>
    <div class="botoes">
      <a class="botao catalogo" href="catalogo/">
        <span class="icone">📚</span>
        <span class="texto"><b>Catálogo</b><span>ver livros, pedir reserva — sem login</span></span>
      </a>
      <a class="botao admin" href="admin/">
        <span class="icone">🔐</span>
        <span class="texto"><b>Administração</b><span>empréstimos, acervo, pessoas — login necessário</span></span>
      </a>
    </div>
    <footer>Sifriyah</footer>
  </div>
</body>
</html>
