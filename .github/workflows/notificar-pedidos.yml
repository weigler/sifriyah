name: Notificar pedidos de fila/reserva

on:
  schedule:
    # a cada 10 minutos — o GitHub costuma atrasar um pouco esse gatilho em horários de
    # pico, então na prática o aviso pode demorar alguns minutos a mais
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # permite rodar manualmente pela aba Actions, pra testar

jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: scripts/package.json

      - name: Instalar dependências
        working-directory: scripts
        run: npm install

      - name: Checar pedidos e notificar
        working-directory: scripts
        run: node checar-pedidos.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SIFRIYAH_DOC_ID: principal
